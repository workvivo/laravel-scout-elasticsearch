name: Test application

on:
    pull_request:
    push:
        branches:
            - master

jobs:
    php:
        name: Run tests with PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - '8.0'
                    - '8.1'
                    - '8.2'
                    - '8.3'

        services:
            opensearch:
                image: opensearchproject/opensearch:2.19.3
                ports:
                    - 9200:9200
                env:
                    DISABLE_INSTALL_DEMO_CONFIG: 'true'
                    DISABLE_SECURITY_PLUGIN: 'true'
                    discovery.type: 'single-node'
                    OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
                options: --health-cmd="curl http://localhost:9200/_cluster/health" --health-interval=10s --health-timeout=5s --health-retries=5
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: yes
                    MYSQL_DATABASE: unittest
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

        steps:
            -   name: Checkout project
                uses: actions/checkout@v4

            -   name: Install and configure PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    tools: 'composer'

            -   name: Get composer cache directory
                id: composer-cache-dir
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            -   name: Cache dependencies
                uses: actions/cache@v4
                id: composer-cache
                with:
                    path: ${{ steps.composer-cache-dir.outputs.dir }}
                    key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
                    restore-keys: |
                        ${{ runner.os }}-composer-

            -   name: Install dependencies
                run: |
                    composer validate --strict
                    composer install --no-interaction --prefer-dist

            -   name: Run tests
                run: XDEBUG_MODE=off vendor/bin/phpunit
                env:
                    DB_CONNECTION: mysql
                    DB_DATABASE: unittest
                    DB_USERNAME: root
                    ELASTICSEARCH_HOST: '127.0.0.1:9200'
                    REDIS_CLIENT: predis
                    REDIS_HOST: '127.0.0.1'
                    REDIS_PORT: 6379

    docker:
        name: Run Docker Compose tests
        runs-on: ubuntu-latest

        env:
            APP_ENV: testing
            TIMEZONE: UTC
            OPENSEARCH_VERSION: 2.19.3
            ELASTICSEARCH_HOST: http://opensearch:9200
            ELASTICSEARCH_USER: ''
            ELASTICSEARCH_PASSWORD: ''
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: my_database
            DB_USERNAME: root
            DB_PASSWORD: YourStrongPassword1!
            XDEBUG_CONFIG: client_port=9005 client_host=host.docker.internal mode=debug start_with_request=yes log=/home/user/xdebug.log
            PHP_IDE_CONFIG: serverName=Scout

        steps:
            -   name: Checkout project
                uses: actions/checkout@v4

            -   name: Configure OpenSearch host limits
                run: sudo sysctl -w vm.max_map_count=262144

            -   name: Install dependencies
                run: make install

            -   name: Run tests
                run: make test
